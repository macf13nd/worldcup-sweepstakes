name: Refresh dashboard

# RETIRED 16 Aug 2026. The tournament ended on 19 July and docs/ is now a frozen
# archive of the final result, so the daily crons are removed: left running they
# overwrote the archive with an all-zero page (bookmakers drop the outright
# market once a tournament ends, so every team reads as eliminated) and spent API
# quota for nothing.
#
# The build itself still works and is kept for reuse (Euro 2028). To bring it
# back: restore the two schedule entries below, point draw.json/aliases.json/
# flags.json/bracket.json at the new tournament, and update the football-data
# competition code in build.py.
#
#   schedule:
#     - cron: "23 6 * * *"     # primary, ~07:23 BST, after overnight fixtures
#     - cron: "23 11 * * *"    # fallback, self-skips if the primary already ran
on:
  workflow_dispatch: {}    # manual only — nothing runs on a schedule any more

permissions:
  contents: write          # commit the regenerated page back to main

concurrency:
  group: refresh           # serialise runs so the fallback sees the primary's commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to run
        id: guard
        run: |
          today="$(date -u +%F)"
          event="${{ github.event_name }}"
          sched="${{ github.event.schedule }}"
          # Manual runs and the primary morning cron always proceed.
          if [ "$event" != "schedule" ] || [ "$sched" != "23 11 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual or primary cron — proceeding."
            exit 0
          fi
          # Fallback cron: run only if the morning run hasn't already written
          # today's snapshot. current.date == today  =>  primary succeeded, skip.
          last="$(jq -r '.current.date // ""' data/standings.json 2>/dev/null || echo "")"
          if [ "$last" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot already current for $today — primary ran; skipping fallback."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot stale (last='$last', today='$today') — primary missed; running fallback."
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build dashboard
        if: steps.guard.outputs.run == 'true'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python build.py

      - name: Build knockout bracket
        if: steps.guard.outputs.run == 'true'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bracket.py

      - name: Commit if changed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/bracket.html data/standings.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dashboard ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No changes."
          fi
